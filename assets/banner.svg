<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Gold Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Decorative Background Grid / Waves -->
  <g opacity="0.12">
    <path d="M-100 180 C 150 120, 350 260, 600 180 C 850 100, 1050 240, 1300 180" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M-100 180 C 150 120, 350 260, 600 180 C 850 100, 1050 240, 1300 180;
                M-100 190 C 200 240, 400 100, 600 190 C 800 280, 1000 120, 1300 190;
                M-100 180 C 150 120, 350 260, 600 180 C 850 100, 1050 240, 1300 180" />
    </path>
    <path d="M-100 220 C 200 280, 450 140, 700 220 C 950 300, 1150 160, 1300 220" fill="none" stroke="#c084fc" stroke-width="2">
      <animate attributeName="d" dur="15s" repeatCount="indefinite"
        values="M-100 220 C 200 280, 450 140, 700 220 C 950 300, 1150 160, 1300 220;
                M-100 200 C 150 150, 400 270, 700 200 C 1000 130, 1100 260, 1300 200;
                M-100 220 C 200 280, 450 140, 700 220 C 950 300, 1150 160, 1300 220" />
    </path>
  </g>

  <!-- Glowing Ambient Orbs (strictly background) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="cx" values="150;180;150" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="280" r="160" fill="#818cf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="cy" values="280;250;280" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Animated Floating Review Badges (Placed discreetly in background/sides so title/subtitle stay clear) -->
  <!-- Floating Card Left -->
  <g transform="translate(60, 240)" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="60,240; 60,230; 60,240" dur="5s" repeatCount="indefinite" />
    <rect width="240" height="70" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadow)" />
    <text x="20" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">★ 5.0 RATED APP</text>
    <text x="20" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Verified Buyer Proof</text>
  </g>

  <!-- Floating Card Right -->
  <g transform="translate(900, 240)" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="900,240; 900,250; 900,240" dur="6s" repeatCount="indefinite" />
    <rect width="240" height="70" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadow)" />
    <text x="20" y="32" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">💬 SOCIAL PROOF UGC</text>
    <text x="20" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Boost Store Conversion</text>
  </g>

  <!-- Dynamic Pulsing 5 Golden Stars at Top -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Center Stars Group -->
    <g transform="translate(-80, 0)">
      <path d="M 0,-14 L 4,-4 L 14,-4 L 6,3 L 9,13 L 0,7 L -9,13 L -6,3 L -14,-4 L -4,-4 Z" fill="url(#starGrad)" />
    </g>
    <g transform="translate(-40, 0)">
      <path d="M 0,-14 L 4,-4 L 14,-4 L 6,3 L 9,13 L 0,7 L -9,13 L -6,3 L -14,-4 L -4,-4 Z" fill="url(#starGrad)" />
    </g>
    <g transform="translate(0, 0)">
      <path d="M 0,-14 L 4,-4 L 14,-4 L 6,3 L 9,13 L 0,7 L -9,13 L -6,3 L -14,-4 L -4,-4 Z" fill="url(#starGrad)">
        <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="2.5s" repeatCount="indefinite" />
      </path>
    </g>
    <g transform="translate(40, 0)">
      <path d="M 0,-14 L 4,-4 L 14,-4 L 6,3 L 9,13 L 0,7 L -9,13 L -6,3 L -14,-4 L -4,-4 Z" fill="url(#starGrad)" />
    </g>
    <g transform="translate(80, 0)">
      <path d="M 0,-14 L 4,-4 L 14,-4 L 6,3 L 9,13 L 0,7 L -9,13 L -6,3 L -14,-4 L -4,-4 Z" fill="url(#starGrad)" />
    </g>
  </g>

  <!-- Foreground Main Title and Subtitle (Guaranteed in foreground and perfectly legible) -->
  <!-- Tag Pill -->
  <g transform="translate(600, 120)" text-anchor="middle">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <text y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#shadow)">
    Awesome Customer Reviews Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    SaaS Platforms • Open-Source Repositories • UGC • Ratings &amp; Testimonial Widgets
  </text>

  <!-- Dynamic Live Indicator Pill -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-85" cy="0" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="4" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      Verified 2026 Edition
    </text>
  </g>
</svg>
